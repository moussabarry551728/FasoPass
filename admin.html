<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FasoPass - Administration</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <h1>👑 Espace Propriétaire</h1>
  <p>Bienvenue Moussa Barry</p>
</header>

<div class="container">

  <section class="card">
    <h2>Tableau de bord</h2>

    <div class="stats">
      <div class="stat"><h3 id="nbEvenements">0</h3><p>Événements</p></div>
      <div class="stat"><h3 id="nbVendeurs">0</h3><p>Vendeurs</p></div>
      <div class="stat"><h3 id="nbAdmins">1</h3><p>Administrateurs</p></div>
      <div class="stat"><h3 id="nbBillets">0</h3><p>Billets vendus</p></div>
    </div>
  </section>

  <section class="card">

    <button id="btnGererAdmins" class="btn green">🛡 Gérer les administrateurs</button>

    <button id="btnGererVendeurs" class="btn yellow">🏢 Gérer les vendeurs</button>

    <button id="btnGererEvenements" class="btn blue">📅 Gérer les événements</button>

    <button id="btnGererTransports" class="btn teal">🚌 Gérer les transports</button>

    <button id="btnPaiements" class="btn purple">💳 Paiements</button>

    <button id="btnStatistiques" class="btn orange">📊 Statistiques</button>

    <button id="btnParametres" class="btn blue">⚙ Paramètres de la plateforme</button>

    <button id="btnRetourAccueil" class="btn red">🚪 Retour à l'accueil</button>

  </section>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
