<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FasoPass - Administration</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4}
header{background:#00853F;color:white;padding:20px;text-align:center}
.container{padding:20px}
.card{background:white;padding:20px;border-radius:15px;margin-bottom:15px;box-shadow:0 4px 10px rgba(0,0,0,.1)}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
button{width:100%;padding:14px;background:#00853F;color:white;border:none;border-radius:10px;font-size:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#FCD116;padding:15px;border-radius:10px;text-align:center;font-weight:bold}
</style>
</head>
<body>

<header>
<h1>🛡 Administration FasoPass</h1>
<p>Espace sécurisé</p>
</header>

<div class="container">

<div class="card">
<h2>Connexion administrateur</h2>
<input type="text" placeholder="Nom d'utilisateur">
<input type="password" placeholder="Mot de passe">
<button>Se connecter</button>
</div>

<div class="card">
<h2>Tableau de bord</h2>
<div class="stats">
<div class="stat">👤 120 Utilisateurs</div>
<div class="stat">🏪 18 Vendeurs</div>
<div class="stat">📄 245 Pass créés</div>
<div class="stat">✅ 96 Vérifications</div>
</div>
</div>

<div class="card">
<h2>Actions rapides</h2>
<button>Gérer les utilisateurs</button>
<br><br>
<button>Gérer les vendeurs</button>
<br><br>
<button>Voir les statistiques</button>
</div>

</div>

</body>
</html>
