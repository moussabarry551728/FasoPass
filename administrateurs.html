<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FasoPass - Administrateurs</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f2f2f2}
.header{background:#00853F;color:white;padding:20px;text-align:center}
.card{background:white;margin:20px;border-radius:20px;padding:20px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
.green{background:#00853F;color:white}
.red{background:#D50032;color:white}
.admin{background:#f7f7f7;padding:15px;border-left:5px solid #00853F;border-radius:10px;margin-top:12px}
a{text-decoration:none}
</style>
</head>
<body>

<div class="header">
<h1>🛡️ Gérer les administrateurs</h1>
</div>

<div class="card">
<h2>Ajouter un administrateur</h2>

<input type="text" placeholder="Nom complet">
<input type="email" placeholder="Adresse e-mail">
<input type="password" placeholder="Mot de passe">

<button class="green">Créer l'administrateur</button>
</div>

<div class="card">
<h2>Liste des administrateurs</h2>

<div class="admin">
<b>Moussa Barry</b><br>
Propriétaire
</div>

<div class="admin">
<b>Administrateur Exemple</b><br>
Accès limité
</div>
</div>

<div class="card">
<a href="admin.html">
<button class="red">⬅ Retour au tableau de bord</button>
</a>
</div>

</body>
</html>
