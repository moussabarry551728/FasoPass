<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FasoPass - Citoyen</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:#f4f6f8;
}
header{
background:linear-gradient(135deg,#00853F,#006B31);
color:white;
padding:25px;
text-align:center;
}
.container{
max-width:500px;
margin:auto;
padding:20px;
}
.card{
background:white;
padding:20px;
margin-top:20px;
border-radius:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}
h2{
color:#00853F;
margin-bottom:12px;
}
input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}
button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
.green{
background:#00853F;
color:white;
}
.gold{
background:#FCD116;
color:black;
}
.profile{
text-align:center;
}
.avatar{
font-size:60px;
margin-bottom:10px;
}
#qr{
display:none;
margin-top:20px;
text-align:center;
}
#qr img{
width:200px;
height:200px;
border-radius:10px;
background:white;
padding:10px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}
.id{
margin-top:10px;
font-weight:bold;
color:#00853F;
}
.status{
display:inline-block;
margin-top:8px;
padding:6px 12px;
background:#00853F;
color:white;
border-radius:20px;
font-size:14px;
}
</style>
</head>

<body>

<header>
<h1>🇧🇫 FasoPass</h1>
<p>Espace Citoyen</p>
</header>

<div class="container">

<div class="card">
<h2>Créer un compte</h2>

<input type="text" placeholder="Nom complet">
<input type="tel" placeholder="Numéro de téléphone">
<input type="password" placeholder="Mot de passe">

<button class="green">Créer mon compte</button>
</div>

<div class="card">
<h2>Se connecter</h2>

<input type="tel" placeholder="Numéro de téléphone">
<input type="password" placeholder="Mot de passe">

<button class="gold">Connexion</button>
</div>

<div class="card profile">

<div class="avatar">👤</div>

<h2>Mon Profil FasoPass</h2>

<p><strong>Nom :</strong> Utilisateur Démo</p>
<p><strong>ID :</strong> FP-2026-0001</p>
<span class="status">Compte actif</span>

<button class="green" onclick="toggleQR()">
Afficher mon QR Code
</button>

<div id="qr">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=FP-2026-0001" alt="QR Code FasoPass">

<p class="id">Identifiant : FP-2026-0001</p>

<p>Présentez ce QR Code pour vérifier votre identité.</p>
</div>

</div>

</div>

<script>
function toggleQR(){
const qr=document.getElementById("qr");
if(qr.style.display==="block"){
qr.style.display="none";
}else{
qr.style.display="block";
}
}
</script>

</body>
</html>
