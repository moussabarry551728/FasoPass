<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FasoPass - Administrateurs</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <h1>🛡 Gestion des Administrateurs</h1>
  <p>Ajouter, supprimer et consulter les administrateurs.</p>
</header>

<div class="container">

  <section class="card">
    <h2>Ajouter un administrateur</h2>

    <input id="nomAdmin" type="text" placeholder="Nom complet">
    <input id="emailAdmin" type="email" placeholder="Email">
    <input id="mdpAdmin" type="password" placeholder="Mot de passe">

    <button class="btn green" id="ajouterAdmin">
      ➕ Ajouter
    </button>
  </section>

  <section class="card">
    <h2>Liste des administrateurs</h2>

    <div id="listeAdmins">

      <div class="admin-item">
        <div>
          <strong>Moussa Barry</strong><br>
          admin@fasopass.com
        </div>

        <button class="btn red supprimerAdmin">
          Supprimer
        </button>
      </div>

    </div>
  </section>

  <button class="btn blue" id="retourAdmin">
    ⬅ Retour au tableau de bord
  </button>

</div>

<script type="module" src="js/app.js"></script>

<script>
document.getElementById("retourAdmin").onclick = () => {
  window.location.href = "admin.html";
};

document.getElementById("ajouterAdmin").onclick = () => {

  const nom = document.getElementById("nomAdmin").value.trim();
  const email = document.getElementById("emailAdmin").value.trim();

  if(!nom || !email){
    alert("Remplissez tous les champs.");
    return;
  }

  const bloc = document.createElement("div");
  bloc.className = "admin-item";

  bloc.innerHTML = `
    <div>
      <strong>${nom}</strong><br>${email}
    </div>
    <button class="btn red supprimerAdmin">Supprimer</button>
  `;

  document.getElementById("listeAdmins").appendChild(bloc);

  document.getElementById("nomAdmin").value="";
  document.getElementById("emailAdmin").value="";
  document.getElementById("mdpAdmin").value="";
};

document.addEventListener("click", e=>{
  if(e.target.classList.contains("supprimerAdmin")){
    e.target.parentElement.remove();
  }
});
</script>

</body>
</html>
