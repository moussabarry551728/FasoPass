<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FasoPass - Billetterie</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f8;
  color:#222;
}

header{
  background:linear-gradient(135deg,#00843d,#f0c300,#d21034);
  color:white;
  text-align:center;
  padding:30px 18px;
}

header h1{
  font-size:34px;
  margin-bottom:10px;
}

header p{
  font-size:17px;
}

.container{
  max-width:600px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  padding:22px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

h2{
  margin-bottom:20px;
  color:#00843d;
}

label{
  display:block;
  margin-top:14px;
  margin-bottom:6px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:none;
  border-radius:8px;
  background:#00843d;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:hover{
  background:#006b31;
}

.result{
  display:none;
  margin-top:25px;
  padding:20px;
  border-radius:12px;
  background:#eef8f2;
  border:2px solid #00843d;
}

.code{
  font-size:24px;
  font-weight:bold;
  color:#d21034;
  text-align:center;
  margin:15px 0;
}

footer{
  text-align:center;
  padding:25px;
  color:#666;
}
</style>
</head>

<body>

<header>
  <h1>🇧🇫 FasoPass</h1>
  <p>Votre plateforme simple de billetterie au Burkina Faso</p>
</header>

<div class="container">

  <div class="card">

    <h2>🎫 Réserver un billet</h2>

    <label>Ville de départ</label>
    <input id="departure" type="text" placeholder="Exemple : Bobo-Dioulasso">

    <label>Ville d'arrivée</label>
    <input id="arrival" type="text" placeholder="Exemple : Ouagadougou">

    <label>Date du voyage</label>
    <input id="date" type="date">

    <label>Nombre de passagers</label>
    <select id="passengers">
      <option value="1">1 passager</option>
      <option value="2">2 passagers</option>
      <option value="3">3 passagers</option>
      <option value="4">4 passagers</option>
      <option value="5">5 passagers</option>
    </select>

    <button onclick="createTicket()">
      🎫 Créer mon billet
    </button>

    <div class="result" id="result">

      <h2>✅ Billet créé</h2>

      <p><strong>Trajet :</strong></p>
      <p id="route"></p>

      <p><strong>Date :</strong></p>
      <p id="travelDate"></p>

      <p><strong>Passagers :</strong></p>
      <p id="passengerCount"></p>

      <p><strong>Code du billet :</strong></p>
      <div class="code" id="ticketCode"></div>

      <button onclick="payment()">
        💳 Continuer vers le paiement
      </button>

    </div>

  </div>

</div>

<footer>
  © 2026 FasoPass — Burkina Faso 🇧🇫
</footer>

<script>

function createTicket(){

  const departure =
    document.getElementById("departure").value.trim();

  const arrival =
    document.getElementById("arrival").value.trim();

  const date =
    document.getElementById("date").value;

  const passengers =
    document.getElementById("passengers").value;

  if(departure === "" || arrival === "" || date === ""){
    alert("Veuillez remplir tous les champs.");
    return;
  }

  const code =
    "FP-" +
    Math.random().toString(36)
    .substring(2,8)
    .toUpperCase();

  document.getElementById("route").textContent =
    departure + " → " + arrival;

  document.getElementById("travelDate").textContent =
    date;

  document.getElementById("passengerCount").textContent =
    passengers;

  document.getElementById("ticketCode").textContent =
    code;

  document.getElementById("result").style.display =
    "block";
}

function payment(){
  alert(
    "Le système de paiement sera ajouté dans une prochaine étape."
  );
}

</script>

</body>
</html>
