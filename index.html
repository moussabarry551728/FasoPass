<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FasoPass - Bobo-Dioulasso</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f4f6f8;color:#222;}
header{
background:linear-gradient(135deg,#00843d,#f0c300,#d21034);
color:white;
text-align:center;
padding:35px 20px;
}
.container{width:94%;max-width:700px;margin:20px auto;}
.card{
background:white;
border-radius:18px;
padding:20px;
margin-bottom:20px;
box-shadow:0 4px 12px rgba(0,0,0,.12);
}
.btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}
.green{background:#00843d;color:white;}
.yellow{background:#f0c300;color:black;}
.red{background:#d21034;color:white;}
input,select{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ccc;
border-radius:10px;
}
.event{
border:1px solid #ddd;
border-radius:14px;
padding:15px;
margin-top:15px;
}
.price{
font-size:28px;
font-weight:bold;
color:#d21034;
margin:10px 0;
}
.hidden{display:none;}
</style>
</head>

<body>

<header>
<div style="font-size:55px;">🎟️</div>
<h1>FasoPass</h1>
<p>Bobo-Dioulasso • Billetterie officielle</p>

<button class="btn" style="background:white;color:#00843d;"
onclick="ouvrirConnexion()">
❤️ Entrer comme Administrateur
</button>
</header>

<div class="container">

<div class="card">
<h2>Bienvenue</h2>
<p>Créez, gérez et achetez des billets facilement.</p>

<button class="btn green" onclick="ouvrirFormulaire()">
Créer un événement
</button>

<button class="btn yellow">
Billet de transport
</button>
</div>

<div class="card hidden" id="formCard">
<h2>Créer un événement</h2>

<input id="nomEvent" placeholder="Nom de l'événement">
<input id="lieuEvent" value="Bobo-Dioulasso">
<input id="dateEvent" type="date">
<input id="heureEvent" type="time">
<input id="prixEvent" type="number" placeholder="Prix FCFA">

<button class="btn green" onclick="creerEvenement()">
Publier l'événement
</button>
</div>

<div class="card">
<h2>Événements disponibles</h2>

<div id="listeEvenements"></div>
</div><div class="card">
<h2>Réserver un billet de transport</h2>

<label>Ville de départ</label>
<input id="depart" value="Bobo-Dioulasso">

<label>Ville d'arrivée</label>
<input id="arrivee" value="Ouagadougou">

<label>Date du voyage</label>
<input id="dateVoyage" type="date">

<label>Nombre de passagers</label>
<input id="passagers" type="number" value="1" min="1">

<button class="btn yellow" onclick="reserverTransport()">
Continuer
</button>
</div>

<div class="card hidden" id="ownerCard">
<h2>👑 Tableau de bord Administrateur</h2>

<p><strong>Nom :</strong> Mouhamed Barry</p>
<p><strong>Ville :</strong> Bobo-Dioulasso</p>

<button class="btn green" onclick="voirEvenements()">
Voir mes événements
</button>

<button class="btn red" onclick="deconnexion()">
Déconnexion
</button>
</div>

</div>

<script>

const OWNER="Mouhamed Barry";

let evenements=JSON.parse(localStorage.getItem("evenements")||"[]");

function ouvrirFormulaire(){
document.getElementById("formCard").classList.remove("hidden");
}

function ouvrirConnexion(){

const nom=prompt("Entrez votre nom d'administrateur :");

if(!nom)return;

localStorage.setItem("utilisateur",nom);

if(nom===OWNER){
document.getElementById("ownerCard").classList.remove("hidden");
alert("Bienvenue Propriétaire Mouhamed Barry !");
}else{
alert("Bienvenue "+nom);
}

}

function deconnexion(){
localStorage.removeItem("utilisateur");
location.reload();
}function creerEvenement(){

const nom=document.getElementById("nomEvent").value;
const lieu=document.getElementById("lieuEvent").value;
const date=document.getElementById("dateEvent").value;
const heure=document.getElementById("heureEvent").value;
const prix=document.getElementById("prixEvent").value;

if(!nom||!lieu||!date||!heure||!prix){
alert("Remplissez tous les champs.");
return;
}

evenements.push({
nom,
lieu,
date,
heure,
prix
});

localStorage.setItem("evenements",JSON.stringify(evenements));

document.getElementById("nomEvent").value="";
document.getElementById("dateEvent").value="";
document.getElementById("heureEvent").value="";
document.getElementById("prixEvent").value="";

document.getElementById("formCard").classList.add("hidden");

mettreAJourInterface();

alert("Événement publié avec succès !");
}

function mettreAJourInterface(){

const liste=document.getElementById("listeEvenements");

liste.innerHTML="";

if(evenements.length===0){

liste.innerHTML=`
<div class="event">
<h3>Concert Live Bobo-Dioulasso</h3>
<p>📍 Bobo-Dioulasso</p>
<p>📅 30 Août 2026</p>
<p>🕗 20h00</p>
<div class="price">2 500 FCFA</div>
<button class="btn green" onclick="acheterBillet('Concert Live Bobo-Dioulasso')">
Acheter mon billet
</button>
</div>
`;

return;
}

evenements.forEach((e)=>{

liste.innerHTML+=`
<div class="event">
<h3>${e.nom}</h3>
<p>📍 ${e.lieu}</p>
<p>📅 ${e.date}</p>
<p>🕗 ${e.heure}</p>
<div class="price">${e.prix} FCFA</div>
<button class="btn green" onclick="acheterBillet('${e.nom}')">
Acheter mon billet
</button>
</div>
`;

});

}

function acheterBillet(nom){
const code="FP-"+Math.floor(Math.random()*999999);
alert(
"Billet confirmé !\n\n"+
"Événement : "+nom+"\n"+
"Code : "+code
);
}function reserverTransport(){

const depart=document.getElementById("depart").value;
const arrivee=document.getElementById("arrivee").value;
const date=document.getElementById("dateVoyage").value;
const passagers=document.getElementById("passagers").value;

if(!depart||!arrivee||!date){
alert("Veuillez remplir tous les champs.");
return;
}

const numero="TR-"+Math.floor(Math.random()*999999);

alert(
"Réservation confirmée !\n\n"+
"Trajet : "+depart+" → "+arrivee+
"\nDate : "+date+
"\nPassagers : "+passagers+
"\nN° Billet : "+numero
);

}

function voirEvenements(){

if(evenements.length===0){
alert("Vous n'avez encore créé aucun événement.");
return;
}

let liste="MES ÉVÉNEMENTS\n\n";

evenements.forEach((e,i)=>{
liste+=(i+1)+". "+e.nom+" ("+e.date+")\n";
});

alert(liste);

}

window.onload=function(){

mettreAJourInterface();

const user=localStorage.getItem("utilisateur");

if(user===OWNER){
document.getElementById("ownerCard").classList.remove("hidden");
}

};

</script>

</body>
</html>
