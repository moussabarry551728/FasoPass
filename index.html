<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FasoPass - Mon billet</title>

    <!-- Bibliothèque QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f3f5;
        }

        header {
            background: #008f45;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: 25px auto;
            padding: 15px;
        }

        .ticket {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.12);
        }

        .ticket h2 {
            text-align: center;
            color: #008f45;
        }

        .info {
            margin: 18px 0;
        }

        .info p {
            margin: 10px 0;
        }

        .info strong {
            color: #333;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 25px 0;
        }

        .status {
            text-align: center;
            background: #e7f7ee;
            color: #008f45;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            margin-top: 15px;
            color: white;
            background: #008f45;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #00783a;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>🎫 FasoPass</h1>
    <p>Mon billet</p>
</header>

<div class="container">

    <div class="ticket">

        <h2>🎟️ Billet FasoPass</h2>

        <div class="info">

            <p>
                <strong>Événement :</strong>
                Concert FasoPass
            </p>

            <p>
                <strong>Client :</strong>
                Moussa Barry
            </p>

            <p>
                <strong>Date :</strong>
                25 décembre 2026
            </p>

            <p>
                <strong>Heure :</strong>
                20:00
            </p>

            <p>
                <strong>Lieu :</strong>
                Ouagadougou
            </p>

            <p>
                <strong>Type :</strong>
                VIP
            </p>

            <p>
                <strong>Prix :</strong>
                10 000 FCFA
            </p>

            <p>
                <strong>Numéro du billet :</strong>
                <span id="ticketNumber"></span>
            </p>

        </div>

        <div id="qrcode"></div>

        <div class="status">
            ✅ Billet valide
        </div>

        <button class="btn" onclick="generateTicket()">
            🔄 Générer un nouveau billet
        </button>

    </div>

</div>

<footer>
    © 2026 FasoPass
</footer>


<script>

/*
    Génération d'un identifiant unique
    pour le billet.
*/
function generateTicketId() {

    const date = Date.now();

    const random =
        Math.random()
        .toString(36)
        .substring(2, 10)
        .toUpperCase();

    return "FP-" + date + "-" + random;
}


/*
    Génération du billet et du QR Code
*/
function generateTicket() {

    const ticketId = generateTicketId();

    document.getElementById("ticketNumber").textContent =
        ticketId;

    /*
        On efface l'ancien QR Code
    */
    document.getElementById("qrcode").innerHTML = "";

    /*
        Données associées au billet.
        Dans la vraie application,
        ces données devront être générées
        par le serveur.
    */
    const ticketData = JSON.stringify({

        ticket_id: ticketId,

        application: "FasoPass",

        event: "Concert FasoPass",

        date: "2026-12-25",

        time: "20:00",

        type: "VIP"

    });


    /*
        Création du QR Code
    */
    new QRCode(
        document.getElementById("qrcode"),
        {
            text: ticketData,

            width: 220,

            height: 220,

            correctLevel:
                QRCode.CorrectLevel.H
        }
    );
}


/*
    Génération initiale
*/
generateTicket();

</script>

</body>
</html>
