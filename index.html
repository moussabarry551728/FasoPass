<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FasoPass</title>

padding:18px;

<button class="btn">Créer un compte</button>

</div>

<div class="card">

<p>✔ Vérification d'identité</p>
